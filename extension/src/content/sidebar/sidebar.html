<aside
	class="shopsage-sidebar"
	role="dialog"
	aria-label="Verdict — анализ отзывов"
>
	<header class="ss-header">
		<div class="brand" aria-hidden="false">
			<img src="" alt="Verdict Logo" width="32" height="32" id="ss-logo" />
			<div class="title">Вердикт</div>
		</div>
		<div style="display: flex; gap: 8px; align-items: center">
			<button
				id="ss-preview-settings"
				class="ss-settings"
				title="Настройки"
				aria-label="Открыть настройки"
			>
				⚙️
			</button>
			<button class="ss-close" title="Закрыть" aria-label="Закрыть">✕</button>
		</div>
	</header>

	<main class="ss-body">
		<div class="ss-controls">
			<button id="ss-analyze" class="btn-primary" aria-live="polite">
				Проанализировать отзывы
			</button>

			<div class="ss-info" title="Количество выбранных отзывов">
				Выбрано <span id="ss-count">0</span>
			</div>

			<div class="ss-meta" aria-hidden="false">
				<div class="muted">Рейтинг: <strong id="ss-rating">—</strong></div>
				<div class="muted">Всего: <strong id="ss-total">—</strong></div>
			</div>

			<div
				id="ss-loader"
				class="ss-loader hidden"
				aria-hidden="true"
				role="status"
				aria-live="polite"
			>
				<span class="visually-hidden">Загрузка</span>
			</div>

			<!-- send-to-server toggle + preview -->
			<div class="ss-send-row" aria-hidden="false">
				<label
					for="ss-send-server"
					style="display: flex; gap: 8px; align-items: center; cursor: pointer"
				>
					<input id="ss-send-server" type="checkbox" />
					<span style="font-size: 12px; color: rgba(207, 230, 255, 0.9)">
						Отправлять анонимизированные отзывы на сервер
					</span>
				</label>
				<button
					id="ss-preview-payload"
					class="btn-secondary"
					title="Посмотреть что будет отправлено"
				>
					Просмотреть payload
				</button>
			</div>
		</div>

		<div id="ss-error" class="error-msg hidden" role="alert"></div>

		<div class="ss-score hidden" id="ss-score-container" aria-hidden="true">
			<div class="score-badge" id="ss-score-badge">—</div>
			<div class="score-bar" aria-hidden="true">
				<div
					class="score-bar-inner"
					id="ss-score-bar-inner"
					style="width: 0%"
				></div>
			</div>
		</div>

		<div class="score-sub hidden" id="ss-score-sub" aria-hidden="true"></div>

		<div id="ss-result" class="ss-result hidden" aria-live="polite">
			<section>
				<h4>Преимущества</h4>
				<ul id="ss-pros" class="pros-list"></ul>
			</section>

			<section>
				<h4>Недостатки</h4>
				<ul id="ss-cons" class="cons-list"></ul>
			</section>

			<section>
				<h4>Заключение</h4>
				<div id="ss-verdict" class="ss-verdict"></div>
			</section>
		</div>
	</main>
</aside>
